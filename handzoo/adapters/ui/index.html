<!doctype html>
<meta charset="utf-8">
<title>HandZoo review</title>
<style>
  :root {
    --bg:#fbfaf7; --panel:#fff; --line:#e2ddd3; --ink:#241f1a; --dim:#7d7468;
    --ok:#2f7d4f; --flag:#9a6b1e; --fail:#a33; --accent:#3a5a8c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --panel:#1e1b16; --line:#332e26; --ink:#ece6db; --dim:#9a9184;
            --ok:#6fbf8c; --flag:#d7a545; --fail:#e07a72; --accent:#8fb0e0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:.6rem 1rem; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:1rem; }
  header b { font-weight:650; letter-spacing:.02em; }
  .dir { color:var(--dim); font-size:12px; font-family:ui-monospace,monospace; }
  main { flex:1; display:flex; min-height:0; }
  nav { width:190px; border-right:1px solid var(--line); overflow-y:auto; flex-shrink:0; }
  nav button { display:block; width:100%; text-align:left; padding:.4rem .7rem; border:0;
               background:none; color:inherit; font:inherit; cursor:pointer;
               border-bottom:1px solid var(--line); }
  nav button:hover { background:var(--panel); }
  nav button[aria-current="true"] { background:var(--panel); font-weight:650;
                                    box-shadow:inset 3px 0 var(--accent); }
  .st { display:inline-block; width:1.1em; }
  .ok{color:var(--ok)} .flag{color:var(--flag)} .fail{color:var(--fail)}
  .done { color:var(--dim); font-size:11px; }
  section { flex:1; display:flex; min-width:0; min-height:0; }
  .pane { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .pane + .pane { border-left:1px solid var(--line); }
  .pane.hidden { display:none; }
  .phead { padding:.3rem .7rem; border-bottom:1px solid var(--line); font-size:11px;
           letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
           display:flex; justify-content:space-between; align-items:center; }
  .phead button { border:0; background:none; color:var(--dim); cursor:pointer; font:inherit; }
  .phead button:hover { color:var(--ink); }
  
  pre.err { flex:1; min-height:0; margin:0; padding:.9rem; overflow:auto; white-space:pre-wrap;
            font:12px/1.6 ui-monospace,monospace; color:var(--fail); background:var(--panel); }
  .toggles { display:flex; gap:.35rem; margin-left:.6rem; }
  .toggles button { padding:.2rem .55rem; font-size:12px; border:1px solid var(--line);
                    border-radius:4px; background:none; color:var(--dim); cursor:pointer; }
  .toggles button[aria-pressed="true"] { color:var(--ink); border-color:var(--accent); }
  .imgwrap { flex:1; min-height:0; overflow:auto; background:#fff; display:flex; }
  .pane img { margin:auto; max-width:100%; max-height:100%; object-fit:contain; padding:.4rem; }
  .imgwrap.zoom { align-items:flex-start; }
  .imgwrap img { width:calc(100% * var(--scale, 1)); }
  .imgwrap.zoom img { max-width:none; max-height:none; }
  .sizer { display:flex; gap:.2rem; align-items:center; }
  .sizer button { border:0; background:none; color:var(--dim); cursor:pointer; font:inherit;
                  padding:0 .25rem; line-height:1; }
  .sizer button:hover { color:var(--ink); }
  .sizer span { font-size:10px; min-width:2.6em; text-align:center; }
  .inkstage { position:relative; display:inline-block; margin:auto; }
  .rgn { position:absolute; border:1.5px dashed var(--accent); background:rgba(58,90,140,.10);
         cursor:pointer; }
  .rgn:hover { background:rgba(58,90,140,.24); }
  .rgn b { position:absolute; top:-1px; left:-1px; background:var(--accent); color:#fff;
           font:10px/1.4 ui-sans-serif,sans-serif; padding:0 .3rem; font-weight:600; }
  .cropbar[hidden] { display:none; }
  .cropbar { padding:.35rem .7rem; border-top:1px solid var(--line); font-size:12px;
             display:flex; gap:.5rem; align-items:center; }
  .cropbar img { max-height:64px; border:1px solid var(--line); background:#fff; }
  .cropbar button { padding:.25rem .6rem; border:1px solid var(--line); border-radius:4px;
                    background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  textarea { flex:1; border:0; padding:.9rem; font:13px/1.6 ui-monospace,SFMono-Regular,monospace;
             background:var(--panel); color:var(--ink); resize:none; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  footer { border-top:1px solid var(--line); padding:.55rem 1rem; display:flex; gap:.6rem;
           align-items:center; flex-wrap:wrap; }
  button.act { padding:.4rem .8rem; border:1px solid var(--line); border-radius:5px;
               background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  button.act:hover:not(:disabled) { border-color:var(--accent); }
  button.act:disabled { opacity:.45; cursor:default; }
  .why { color:var(--dim); font-size:12px; }
  .findings { padding:.4rem .9rem; border-bottom:1px solid var(--line); font-size:12px;
              max-height:7em; overflow-y:auto; }
  .findings div { margin:.15rem 0; }
  .gate { font-family:ui-monospace,monospace; }
  .msg { margin-left:auto; font-size:12px; color:var(--dim); }
</style>

<header>
  <b>HandZoo</b>
  <span class="dir" id="dir"></span>
  <span class="toggles">
    <button id="t-ink"  aria-pressed="true">ink</button>
    <button id="t-set"  aria-pressed="true">typeset</button>
    <button id="t-tex"  aria-pressed="true">tex</button>
    <button id="hide-diag" aria-pressed="false" title="hide pages whose only finding is an
      invented drawing — they need the crop tool, not the editor">hide diagram-only</button>
  </span>
  <span class="msg" id="msg"></span>
  <span class="done" id="saveState" style="margin-left:.7rem"></span>
</header>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="pane" id="pane-ink">
      <div class="phead"><span>ink</span>
        <span class="sizer"><button data-scale="ink" data-d="-1">−</button>
        <span id="s-ink">100%</span><button data-scale="ink" data-d="1">+</button>
        <button id="zoomb">fit</button></span></div>
      <div class="imgwrap" id="imgwrap">
        <span class="inkstage" id="stage"><img id="img" alt="page image"></span>
      </div>
      <div class="cropbar" id="cropbar" hidden>
        <img id="cropprev" alt="cropped figure">
        <span id="cropmsg"></span>
        <button id="cropkeep">Keep it</button>
        <button id="cropdrop">Discard</button>
      </div>
    </div>
    <div class="pane" id="pane-set">
      <div class="phead"><span>typeset</span>
        <span class="sizer"><button data-scale="set" data-d="-1">−</button>
        <span id="s-set">100%</span><button data-scale="set" data-d="1">+</button>
        <button id="reset">recompile</button></span></div>
      <div class="imgwrap" id="setwrap"><img id="pdf" alt="typeset page"></div>
      <pre class="err" id="err" hidden></pre>
    </div>
    <div class="pane" id="pane-tex">
      <div class="phead"><span>tex</span>
        <span class="sizer"><button data-scale="tex" data-d="-1">−</button>
        <span id="s-tex">100%</span><button data-scale="tex" data-d="1">+</button></span></div>
      <div class="findings" id="findings"></div>
      <textarea id="tex" spellcheck="false" placeholder="select a page"></textarea>
    </div>
  </section>
</main>

<footer>
  <button class="act" id="accept" disabled>Looks right</button>
  <button class="act" id="fix" disabled>Fix transcription</button>
  <button class="act" id="author" disabled>Edit my notes</button>
  <span class="why"><b>Looks right</b> records that you read it and it is correct — evidence no
  gate can produce. Only <b>fix</b> measures the tool.</span>
</footer>

<script>
const $ = id => document.getElementById(id);
let pages = [], current = null, opened = 0, original = "";

const say = t => { $("msg").textContent = t; };

async function load() {
  const r = await (await fetch("/api/pages")).json();
  $("dir").textContent = r.dir;
  pages = r.pages;
  $("nav").innerHTML = "";
  for (const p of pages) {
    const b = document.createElement("button");
    const mark = p.state === "ok" ? "✓" : p.state === "flag" ? "⚠" : "✗";
    b.innerHTML = `<span class="st ${p.state}">${mark}</span> p${p.page}` +
                  (p.diagram_only ? ` <span class="done">◨ diagram</span>` : "") +
                  (p.reviewed ? ` <span class="done">seen</span>` : "");
    if (p.diagram_only) b.dataset.diagram = "1";
    b.onclick = () => select(p.page);
    b.dataset.page = p.page;
    $("nav").appendChild(b);
  }
  if ($("hide-diag").getAttribute("aria-pressed") === "true")
    for (const b of $("nav").children)
      if (b.dataset.diagram === "1") b.style.display = "none";
  if (current !== null) mark(current);
}

function mark(page) {
  for (const b of $("nav").children)
    b.setAttribute("aria-current", String(Number(b.dataset.page) === page));
}

async function select(page) {
  await flush();               // never carry an unsaved edit onto the next page
  const r = await fetch("/api/text?page=" + page);
  if (!r.ok) { say("no output on disk for page " + page); return; }
  const d = await r.json();
  current = page; original = d.text;
  $("tex").value = d.text;
  $("img").src = "/api/image?page=" + page;
  const p = pages.find(x => x.page === page);
  $("findings").innerHTML = (p.findings || []).length
    ? p.findings.map(f =>
        `<div><span class="gate ${f.gate === "reference" ? "flag" : "fail"}">[${f.gate}]</span> ` +
        `${escapeHtml(f.detail)}${f.line ? ` <span class="done">line ${f.line}</span>` : ""}</div>`
      ).join("")
    : `<div class="done">Nothing flagged. The gates cannot see substitution, so this is not a
       statement that the page is correct.</div>`;
  $("fix").disabled = $("author").disabled = $("accept").disabled = false;
  // Timing starts when the page is opened, matching --fix's protocol.
  opened = performance.now();
  dirty = false; $("saveState").textContent = "";
  mark(page);
  say("");
  loadTypeset(page);
  loadRegions(page);
}

const escapeHtml = s => s.replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function save(mode) {
  if (current === null) return;
  const text = $("tex").value;
  if (text === original && mode !== "accept") {
    say('nothing changed — use "Looks right" if it is correct');
    return;
  }
  const seconds = (performance.now() - opened) / 1000;
  const r = await (await fetch("/api/save", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page: current, mode, text, seconds, ui_mode: "web-side-by-side" })
  })).json();
  if (r.error) { say("error: " + r.error); return; }
  original = text; dirty = false; $("saveState").textContent = "";
  const note = r.quarantined ? " — NOW FAILS A GATE, quarantined"
             : r.revalidated ? " — re-gated clean, quarantine released" : "";
  say(r.saved ? `saved as ${r.verdict} — ${seconds.toFixed(1)}s${note}` : "unchanged");
  load();
  loadTypeset(current);
}

// Pane sizing. Persisted per pane: a comfortable size on one screen is not comfortable on
// the next, and re-setting it every session is the kind of friction that stops a review run.
const scales = JSON.parse(localStorage.getItem("hz-scales") || '{"ink":1,"set":1,"tex":1}');
function applyScale(k) {
  const v = scales[k];
  $("s-" + k).textContent = Math.round(v * 100) + "%";
  if (k === "tex") $("tex").style.fontSize = (13 * v) + "px";
  else document.querySelector("#pane-" + k + " .imgwrap").style.setProperty("--scale", v);
  try { localStorage.setItem("hz-scales", JSON.stringify(scales)); } catch (e) {}
}
for (const b of document.querySelectorAll(".sizer button[data-scale]")) {
  b.onclick = () => {
    const k = b.dataset.scale;
    scales[k] = Math.min(4, Math.max(0.5, scales[k] + Number(b.dataset.d) * 0.15));
    applyScale(k);
  };
}
["ink","set","tex"].forEach(applyScale);

$("hide-diag").onclick = () => {
  const on = $("hide-diag").getAttribute("aria-pressed") !== "true";
  $("hide-diag").setAttribute("aria-pressed", String(on));
  for (const b of $("nav").children)
    b.style.display = (on && b.dataset.diagram === "1") ? "none" : "";
};

$("zoomb").onclick = () => $("imgwrap").classList.toggle("zoom");
$("reset").onclick = () => loadTypeset(current);

for (const [btn, pane] of [["t-ink","pane-ink"],["t-set","pane-set"],["t-tex","pane-tex"]]) {
  $(btn).onclick = () => {
    const on = $(btn).getAttribute("aria-pressed") !== "true";
    $(btn).setAttribute("aria-pressed", String(on));
    $(pane).classList.toggle("hidden", !on);
  };
}

// --- crop -------------------------------------------------------------------------
// Regions come from the ink (rasterize.page_blocks), drawn over the page so the human
// clicks a band rather than reading four numbers off a list. They are an assist, not
// evidence: an empty list means "no suggestions", never "no diagram here".
let pendingCrop = null;

function imageReady() {
  const img = $("img");
  if (img.complete && img.naturalWidth) return Promise.resolve();
  return new Promise(res => {
    img.addEventListener("load", res, { once: true });
    img.addEventListener("error", res, { once: true });   // never hang on a missing page
  });
}

async function loadRegions(page) {
  for (const el of document.querySelectorAll(".rgn")) el.remove();
  $("cropbar").hidden = true; pendingCrop = null;

  // The bands are positioned as percentages of the wrapper, and the wrapper is sized by the
  // image inside it. Reassigning img.src collapses that wrapper to nothing until the new
  // image arrives -- and `Cache-Control: no-store` means it is re-fetched every time -- so
  // bands drawn before then get zero size and vanish. They are in the DOM and invisible,
  // which is the worst of both. Measured: several bands on first load, none after a crop.
  await imageReady();

  const r = await fetch("/api/regions?page=" + page);
  if (!r.ok) { return; }                       // 409 carries the reason; shown on demand
  const d = await r.json();
  if (!d.markers) return;                      // nothing to replace, so nothing to offer
  d.regions.forEach((rg, i) => {
    const el = document.createElement("div");
    el.className = "rgn";
    el.style.left = (rg.left * 100) + "%";
    el.style.top = (rg.top * 100) + "%";
    el.style.width = (rg.width * 100) + "%";
    el.style.height = (rg.height * 100) + "%";
    el.innerHTML = `<b>${i + 1}</b>`;
    el.title = `${rg.paths} strokes — click to cut this band`;
    el.onclick = (e) => { e.stopPropagation(); doCrop(page, rg.points); };
    $("stage").appendChild(el);
  });
  say(`${d.regions.length} candidate region(s) — click one to cut it`);
}

async function doCrop(page, points) {
  say("cutting…");
  const r = await fetch("/api/crop", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page, region: points })
  });
  if (!r.ok) { say("crop failed: " + await r.text()); return; }
  const d = await r.json();
  pendingCrop = d.name;
  $("cropprev").src = d.preview;
  $("cropmsg").textContent = `${d.name} — ${d.bytes.toLocaleString()} bytes, vector`;
  $("cropbar").hidden = false;
}

$("cropkeep").onclick = async () => {
  if (!pendingCrop || current === null) return;
  const r = await fetch("/api/crop/confirm", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page: current, name: pendingCrop,
                           seconds: (performance.now() - opened) / 1000,
                           ui_mode: "web-side-by-side" })
  });
  if (!r.ok) { say("could not place it: " + await r.text()); return; }
  const d = await r.json();
  $("cropbar").hidden = true; pendingCrop = null;
  say(`figure placed — ${d.remaining} marker(s) left` +
      (d.released ? ", page released from quarantine" : ""));
  await select(current);
  load();
};
$("cropdrop").onclick = () => { $("cropbar").hidden = true; pendingCrop = null; say(""); };

async function loadTypeset(page) {
  if (page === null) return;
  $("err").hidden = true; $("setwrap").hidden = false;
  $("pdf").removeAttribute("src");
  // Ask first, then point the frame at the endpoint itself. A blob: URL is the obvious
  // move and Chrome will not render a PDF from one inside an iframe — the pane just goes
  // white, which is the failure mode this whole function exists to avoid.
  const url = "/api/typeset?page=" + page;
  const r = await fetch(url);
  if (r.ok) {
    $("pdf").src = url;
  } else {
    // Never a blank pane: an empty typeset column reads as "nothing on this page".
    $("setwrap").hidden = true; $("err").hidden = false;
    $("err").textContent = "does not typeset\n\n" + await r.text();
  }
}
// Autosave: writes the file so navigating away cannot lose an edit. It records no verdict —
// the buttons still do that. Debounced, and flushed before leaving a page.
let pending = null, dirty = false;
async function flush() {
  if (!dirty || current === null) return;
  clearTimeout(pending); pending = null; dirty = false;
  await fetch("/api/autosave", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page: current, text: $("tex").value })
  });
}
$("tex").addEventListener("input", () => {
  dirty = true;
  $("saveState").textContent = "unsaved";
  clearTimeout(pending);
  pending = setTimeout(async () => { await flush(); $("saveState").textContent = "autosaved"; },
                       1500);
});
window.addEventListener("beforeunload", () => {
  if (dirty) navigator.sendBeacon("/api/autosave",
    new Blob([JSON.stringify({ page: current, text: $("tex").value })],
             { type: "application/json" }));
});

$("accept").onclick = () => save("accept");
$("fix").onclick = () => save("fix");
$("author").onclick = () => save("author");
load();
</script>
